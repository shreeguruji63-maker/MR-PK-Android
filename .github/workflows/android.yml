name: Build MR.PK APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip MR_PK_Android_Starter\ \(2\).zip

      - name: Build APK
        run: gradle assembleDebug
        working-directory: MR_PK_Android_Starter

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-PK-APK
          path: MR_PK_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
